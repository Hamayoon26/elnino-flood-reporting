<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Niño Flood Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-office console. Thin top bar, one working surface per screen, wide tables scroll in their own frame. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --sunk:#e3e9eb; --line:#cfd8dc; --ink:#13232d; --muted:#566974;
  --flood:#0d5c80; --flood-soft:#d7e8f0; --silt:#a5621f; --silt-soft:#f3e5d4;
  --ok:#2c7a4b; --bad:#b3362c; --bad-soft:#f6dedb;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a20; --surface:#16252d; --sunk:#1d2f38; --line:#2c434e; --ink:#e3ecef; --muted:#93a8b2;
  --flood:#5fb3d9; --flood-soft:#173a4b; --silt:#e0a062; --silt-soft:#3d2c1b;
  --ok:#6cc290; --bad:#ef8a80; --bad-soft:#47221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#16252d; --sunk:#1d2f38; --line:#2c434e; --ink:#e3ecef; --muted:#93a8b2;
  --flood:#5fb3d9; --flood-soft:#173a4b; --silt:#e0a062; --silt-soft:#3d2c1b;
  --ok:#6cc290; --bad:#ef8a80; --bad-soft:#47221f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{padding-inline:16px;padding-block:20px 48px;max-width:1500px;margin:0 auto}
.narrow{max-width:860px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-inline:16px;padding-block:10px;max-width:1500px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-stretch:80%;font-size:18px;letter-spacing:.01em;display:flex;gap:10px;align-items:center}
.brand .mark{width:22px;height:22px;flex:none}
.who{font-size:13px;color:var(--muted);flex:1;min-width:0}
.who b{color:var(--ink);font-family:var(--mono);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--flood)}
.btn.primary{background:var(--flood);border-color:var(--flood);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
/* PIN */
.pin{min-height:78vh;display:grid;place-items:center;padding-inline:16px}
.pin-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:grid;gap:16px}
.pin-card h1{font-size:28px}
.pin-card p{margin:0;color:var(--muted)}
.showpin{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;justify-self:start}
.showpin input{accent-color:var(--flood)}
.pin-input{font-family:var(--mono);font-size:26px;letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);width:100%}
.msg{font-size:14px;padding:8px 12px;border-radius:var(--r)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--flood-soft);color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* home */
.home-head{display:grid;gap:6px;margin-bottom:20px}
.home-head h1{font-size:clamp(26px,4vw,36px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.tile{display:grid;gap:8px;text-align:left;padding:20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:150px;align-content:start;position:relative}
.tile .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tile h2{font-size:24px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile.impact{border-top:4px solid var(--silt)}
.tile.response{border-top:4px solid var(--flood)}
.tile:not([disabled]):hover{box-shadow:0 2px 0 var(--line);transform:translateY(-1px)}
.tile[disabled]{cursor:not-allowed;background:var(--sunk);border-top-color:var(--line)}
.tile[disabled] h2,.tile[disabled] p{color:var(--muted)}
.tile .state{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tile:not([disabled]) .state{color:var(--ok)}
.tile[disabled] .state{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:18px;max-width:75ch}
/* forms */
.page-head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between;margin-bottom:18px}
.page-head h1{font-size:clamp(24px,3.4vw,32px)}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:4px;max-width:80ch}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:18px;margin:0 0 16px;display:grid;gap:16px;min-width:0}
legend{font-family:var(--display);font-weight:700;font-stretch:85%;font-size:18px;padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 18px}
.f{display:grid;gap:5px;min-width:0}
.f>label,.f>.lab{font-weight:500;font-size:14px}
.f .hint{font-size:12px;color:var(--muted)}
.req::after{content:" *";color:var(--bad)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--bg);width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input[type=number]{font-family:var(--mono);text-align:right}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg);cursor:pointer;font-size:14px}
.opt:has(input:checked){background:var(--flood-soft);border-color:var(--flood)}
.opt input{margin:0;accent-color:var(--flood)}
.invalid{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.scope{background:var(--silt-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--sunk);z-index:2;font-weight:600;font-size:12px;line-height:1.25;vertical-align:bottom}
thead tr.grp th{top:0;font-family:var(--display);font-stretch:85%;font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-bottom:none;text-align:center;border-left:1px solid var(--line)}
thead tr.grp+tr th{top:31px}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
tbody tr:hover td{background:var(--flood-soft)}
tfoot td{position:sticky;bottom:0;background:var(--sunk);font-weight:600;border-top:2px solid var(--ink)}
.stick{position:sticky;left:0;z-index:1;background:var(--surface)}
thead th.stick{z-index:3;background:var(--sunk)}
tbody tr:nth-child(even) td.stick{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.zero{color:var(--muted)}
.orgs{min-width:120px;font-size:12px}
/* entry grid */
.entry td{padding:4px 5px}
.entry input[type=number]{width:84px;padding:5px 6px}
.entry input[type=date]{width:136px;padding:5px 6px}
.entry select{width:150px;padding:5px 6px}
.entry input[type=text]{width:160px;padding:5px 6px}
.entry .loc{min-width:180px;max-width:220px}
.entry .loc b{display:block;font-size:13px}
.entry .loc small{color:var(--muted)}
.entry tr.dirty td.stick{box-shadow:inset 4px 0 0 var(--flood)}
.entry tr.saved td.stick{box-shadow:inset 4px 0 0 var(--ok)}
.entry tr.err td.stick{box-shadow:inset 4px 0 0 var(--bad)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-top:3px}
.pill.new{background:var(--flood-soft);color:var(--flood)}
/* dashboard */
.dash-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start;margin-bottom:14px}
.dash-head h1{font-size:clamp(24px,3.2vw,34px)}
.draft{color:var(--bad);font-weight:700}
.disclaimer{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.disclaimer b{color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.toolbar .f{width:min(100%,240px)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.view-title{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:18px;margin:6px 0 8px}
.meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chiplab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:52px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chipbtn:hover{border-color:var(--flood)}
.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
table.daily td{white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.daily td.longtxt{white-space:pre-wrap;min-width:360px;max-width:560px}
tr.subtotal td{background:var(--flood-soft)!important;font-weight:600;border-bottom:2px solid var(--line)}
.editbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--flood-soft);border:1px solid var(--flood);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px}
tr.editing td{background:var(--flood-soft)!important}
.banner{font-size:13px;padding:8px 16px;background:var(--silt-soft);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--r);font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
@media (max-width:760px){.dash-head{grid-template-columns:1fr}}
@media (max-width:620px){.who{order:3;flex-basis:100%}.brand{flex:1}}
thead th.num{font-family:var(--body);white-space:normal;min-width:84px}
td:nth-child(2){min-width:130px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="config.js"></script>
</head>
<body>

<div id="banner" class="banner" hidden></div>
<header class="bar" id="bar" hidden>
  <div class="in">
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="var(--flood)" stroke-width="2.2" stroke-linecap="round"/><path d="M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="var(--silt)" stroke-width="2.2" stroke-linecap="round"/><path d="M12 3l3.5 6h-7z" fill="var(--flood)"/></svg>El Niño Flood Reporting</div>
    <div class="who" id="who"></div>
    <button class="btn ghost sm" id="goHome" type="button">Home</button>
    <button class="btn sm" id="lock" type="button">Lock</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DATA = {"districts":[{"c":"baki","r":"awdal","n":"Baki"},{"c":"borama","r":"awdal","n":"Borama"},{"c":"lughaye","r":"awdal","n":"Lughaye"},{"c":"zeylac","r":"awdal","n":"Zeylac"},{"c":"ceel_barde","r":"bakool","n":"Ceel Barde"},{"c":"rab_dhuure","r":"bakool","n":"Rab Dhuure"},{"c":"tayeeglow","r":"bakool","n":"Tayeeglow"},{"c":"waajid","r":"bakool","n":"Waajid"},{"c":"xudur","r":"bakool","n":"Xudur"},{"c":"abdiaziz","r":"banadir","n":"Abdiaziz"},{"c":"bondhere","r":"banadir","n":"Bondhere"},{"c":"daynile","r":"banadir","n":"Daynile"},{"c":"hamar_jajab","r":"banadir","n":"Hamar Jajab"},{"c":"hamar_weyne","r":"banadir","n":"Hamar Weyne"},{"c":"heliwaa","r":"banadir","n":"Heliwaa"},{"c":"hodan","r":"banadir","n":"Hodan"},{"c":"howlwadaag","r":"banadir","n":"Howlwadaag"},{"c":"karaan","r":"banadir","n":"Karaan"},{"c":"kaxda","r":"banadir","n":"Kaxda"},{"c":"shangani","r":"banadir","n":"Shangani"},{"c":"shibis","r":"banadir","n":"Shibis"},{"c":"waaberi","r":"banadir","n":"Waaberi"},{"c":"wadajir","r":"banadir","n":"Wadajir"},{"c":"warta_nabada","r":"banadir","n":"Warta Nabada"},{"c":"yaqshid","r":"banadir","n":"Yaqshid"},{"c":"bandarbeyla","r":"bari","n":"Bandarbeyla"},{"c":"bossaso","r":"bari","n":"Bossaso"},{"c":"caluula","r":"bari","n":"Caluula"},{"c":"iskushuban","r":"bari","n":"Iskushuban"},{"c":"qandala","r":"bari","n":"Qandala"},{"c":"qardho","r":"bari","n":"Qardho"},{"c":"baidoa","r":"bay","n":"Baidoa"},{"c":"buur_hakaba","r":"bay","n":"Buur Hakaba"},{"c":"diinsoor","r":"bay","n":"Diinsoor"},{"c":"qansax_dheere","r":"bay","n":"Qansax Dheere"},{"c":"cabudwaaq","r":"galgaduud","n":"Cabudwaaq"},{"c":"cadaado","r":"galgaduud","n":"Cadaado"},{"c":"ceel_buur","r":"galgaduud","n":"Ceel Buur"},{"c":"ceel_dheer","r":"galgaduud","n":"Ceel Dheer"},{"c":"dhuusamarreeb","r":"galgaduud","n":"Dhuusamarreeb"},{"c":"baardheere","r":"gedo","n":"Baardheere"},{"c":"belet_xaawo","r":"gedo","n":"Belet Xaawo"},{"c":"ceel_waaq","r":"gedo","n":"Ceel Waaq"},{"c":"doolow","r":"gedo","n":"Doolow"},{"c":"garbahaarey","r":"gedo","n":"Garbahaarey"},{"c":"luuq","r":"gedo","n":"Luuq"},{"c":"belet_weyne","r":"hiraan","n":"Belet Weyne"},{"c":"bulo_burto","r":"hiraan","n":"Bulo Burto"},{"c":"jalalaqsi","r":"hiraan","n":"Jalalaqsi"},{"c":"mataban","r":"hiraan","n":"Mataban"},{"c":"maxaas","r":"hiraan","n":"Maxaas"},{"c":"afmadow","r":"lower_juba","n":"Afmadow"},{"c":"badhaadhe","r":"lower_juba","n":"Badhaadhe"},{"c":"jamaame","r":"lower_juba","n":"Jamaame"},{"c":"kismaayo","r":"lower_juba","n":"Kismaayo"},{"c":"afgooye","r":"lower_shabelle","n":"Afgooye"},{"c":"baraawe","r":"lower_shabelle","n":"Baraawe"},{"c":"kurtunwaarey","r":"lower_shabelle","n":"Kurtunwaarey"},{"c":"marka","r":"lower_shabelle","n":"Marka"},{"c":"qoryooley","r":"lower_shabelle","n":"Qoryooley"},{"c":"sablaale","r":"lower_shabelle","n":"Sablaale"},{"c":"wanla_weyn","r":"lower_shabelle","n":"Wanla Weyn"},{"c":"buale","r":"middle_juba","n":"Bu'aale"},{"c":"jilib","r":"middle_juba","n":"Jilib"},{"c":"saakow","r":"middle_juba","n":"Saakow"},{"c":"adan_yabaal","r":"middle_shabelle","n":"Adan Yabaal"},{"c":"balcad","r":"middle_shabelle","n":"Balcad"},{"c":"cadale","r":"middle_shabelle","n":"Cadale"},{"c":"jowhar","r":"middle_shabelle","n":"Jowhar"},{"c":"gaalkacyo","r":"mudug","n":"Gaalkacyo"},{"c":"galdogob","r":"mudug","n":"Galdogob"},{"c":"hobyo","r":"mudug","n":"Hobyo"},{"c":"jariiban","r":"mudug","n":"Jariiban"},{"c":"xarardheere","r":"mudug","n":"Xarardheere"},{"c":"burtinle","r":"nugaal","n":"Burtinle"},{"c":"eyl","r":"nugaal","n":"Eyl"},{"c":"garowe","r":"nugaal","n":"Garowe"},{"c":"ceel_afweyn","r":"sanaag","n":"Ceel Afweyn"},{"c":"ceerigaabo","r":"sanaag","n":"Ceerigaabo"},{"c":"laasqoray","r":"sanaag","n":"Laasqoray"},{"c":"caynabo","r":"sool","n":"Caynabo"},{"c":"laas_caanood","r":"sool","n":"Laas Caanood"},{"c":"taleex","r":"sool","n":"Taleex"},{"c":"xudun","r":"sool","n":"Xudun"},{"c":"burao","r":"togdheer","n":"Burao"},{"c":"buuhoodle","r":"togdheer","n":"Buuhoodle"},{"c":"oodweyne","r":"togdheer","n":"Oodweyne"},{"c":"sheikh","r":"togdheer","n":"Sheikh"},{"c":"berbera","r":"woqooyi_galbeed","n":"Berbera"},{"c":"gebiley","r":"woqooyi_galbeed","n":"Gebiley"},{"c":"hargeysa","r":"woqooyi_galbeed","n":"Hargeysa"}]};
const API_URL = String(window.FLOOD_API_URL||"").trim();

/* ---------- reference tables ---------- */
const REGIONS = {awdal:"Awdal",bakool:"Bakool",banadir:"Banadir",bari:"Bari",bay:"Bay",galgaduud:"Galgaduud",gedo:"Gedo",hiraan:"Hiraan",lower_juba:"Lower Juba",lower_shabelle:"Lower Shabelle",middle_juba:"Middle Juba",middle_shabelle:"Middle Shabelle",mudug:"Mudug",nugaal:"Nugaal",sanaag:"Sanaag",sool:"Sool",togdheer:"Togdheer",woqooyi_galbeed:"Woqooyi Galbeed"};
const DIST = {}; DATA.districts.forEach(d=>DIST[d.c]=d);
const dName = c => DIST[c]?.n || c || "";
const rName = c => REGIONS[c] || c || "";

const ABC_ROLE=[["lead","ABC Facilitator"],["co_lead","ABC Co-Facilitator"],["member","ABC Member"],["other","OCHA staff"],["other___not_part_of_an_abc_forum","Other / not part of an ABC forum"]];
const CRISIS=[["flood","Flood"],["conflict","Conflict"],["disease_outbreak","Disease outbreak"],["drought","Drought"]];

/* ---------- storage: Google Apps Script web app (Google Sheet) ---------- */
const store={mode:"loading",impact:new Map(),response:new Map(),qualitative:new Map(),timer:null};
const API_ERR={bad_pin:"That code isn't recognised. Check it against the code list from your ABC forum and try again.",not_allowed:"Your code doesn't allow this action for that district.",busy:"The database is busy. Try again in a moment."};
async function api(action,payload={}){
  if(!API_URL) throw new Error("This site isn't connected to its database yet. Add the Apps Script web app URL to config.js.");
  let res;
  try{ res=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,pin:S.pin,...payload})}); }
  catch(e){ throw new Error("Can't reach the database. Check your internet connection and try again."); }
  let j; try{ j=await res.json(); }catch(e){ throw new Error("The database sent an unexpected reply. Check that the web app is deployed with access for Anyone."); }
  if(!j.ok){ const err=new Error(API_ERR[j.error]||j.error||"Request failed"); err.code=j.error; throw err; }
  return j;
}
async function loadData(quiet){
  try{
    const j=await api("list");
    store.impact=new Map(j.impact.map(r=>[r.id,r])); store.response=new Map(j.response.map(r=>[r.id,r])); store.qualitative=new Map((j.qualitative||[]).map(r=>[r.id,r]));
    store.mode="api"; $("#banner").hidden=true; rerender();
  }catch(e){ if(!quiet) showBanner(e.message); }
}
function startSync(){ clearInterval(store.timer); store.mode="loading"; loadData(); store.timer=setInterval(()=>loadData(true),60000); }
function stopSync(){ clearInterval(store.timer); store.impact=new Map(); store.response=new Map(); store.qualitative=new Map(); store.mode="loading"; }
async function saveDoc(coll,id,data){ const j=await api("save",{coll,rec:{...data,id}}); store[coll].set(id,j.rec); }
async function deleteDoc(coll,id){ await api("delete",{coll,id}); store[coll].delete(id); }
function showBanner(t){const b=$("#banner");b.textContent=t;b.hidden=false}

function go(view){
  if(S.dirty && view!==S.view && !go.force){ pendingLeave(view); return; }
  go.force=false; S.dirty=false; S.view=view; render(); window.scrollTo(0,0);
}
function pendingLeave(view){
  const host=document.querySelector("#leaveBox"); if(!host) { go.force=true; go(view); return; }

}
function rerender(){ if(S.view==="impactReport"||S.view==="responseReport"||S.view==="dailyImpact"||S.view==="dailyResponse"||S.view==="dailyQual"||S.view==="home") render(); else if(S.view==="impactEntry") renderImpactList(); else if(S.view==="qualEntry") renderQualList(); else if(S.view==="responseEntry"){ if(!S.dirty) render(); else renderRespList(); } }

}

function fillRow(tr){
  const [d]=[tr.dataset.d]; const s=tr.dataset.s;

  tr.querySelectorAll("[data-f]").forEach(el=>{ const v=el.dataset.f==="report_date"? today() : (rec? rec[el.dataset.f]:null); el.value = v==null? "" : v; el.classList.remove("invalid"); });

}
function updDirty(){ const n=document.querySelectorAll("#respTbl tr.dirty").length; const el=$("#dirtyCount"); if(el) el.textContent= n? `${n} row${n>1?"s":""} with unsaved changes` : ""; if(!n) S.dirty=false; }
async function saveResponses(){
  const m=$("#respMsg"); m.hidden=true;
  const org=$("#org").value.trim();
  if(!org){ $("#org").classList.add("invalid"); m.hidden=false;m.className="msg bad";m.textContent="Enter the Reporting Organisation Name first."; $("#org").focus(); return; }
  $("#org").classList.remove("invalid"); respOrg=org;
  const trs=[...document.querySelectorAll("#respTbl tr.dirty")];
  if(!trs.length){ m.hidden=false;m.className="msg ok";m.textContent="Nothing to submit. Fill in at least one row."; return; }
  const req=["response_status","TOTAL_Number_of_People","confirm_accuracy"];
  let saved=0, bad=0, err=null;
  for(const tr of trs){
    const rec={}; let any=false;
    tr.querySelectorAll("[data-f]").forEach(el=>{el.classList.remove("invalid"); const f=el.dataset.f; let v=el.value.trim(); if(v!==""&&f!=="report_date") any=true; rec[f]= el.type==="number"? (v===""?null:num(v)) : v; });
    const id=respId(org,tr.dataset.d,tr.dataset.s);
    if(!any){ if(store.response.has(id)){ try{await deleteDoc("response",id);}catch(e){} } tr.classList.remove("dirty"); continue; }
    const miss=req.filter(f=>rec[f]===""||rec[f]==null);
    if(rec.confirm_accuracy && rec.confirm_accuracy!=="yes") miss.push("confirm_accuracy");
    if(miss.length){ miss.forEach(f=>tr.querySelector(`[data-f="${f}"]`).classList.add("invalid")); tr.classList.add("err"); bad++; continue; }
    if(!rec.report_date) rec.report_date=today();
    Object.assign(rec,{Response_Form_Code:S.pin,Reporting_Organisation_Name:org,affected_region:DIST[tr.dataset.d].r,affected_district:tr.dataset.d,affected_settlement:tr.dataset.s,_savedAt:new Date().toISOString()});
    try{ await saveDoc("response",id,rec); tr.classList.remove("dirty","err"); tr.classList.add("saved"); saved++; }catch(e){ err=e; break; }
  }
  updDirty();
  m.hidden=false;
  if(err){ m.className="msg bad"; m.textContent=err.message; return; }
  m.className= bad? "msg bad":"msg ok";
  m.textContent = (saved? `Submitted ${saved} row${saved>1?"s":""}. `:"") + (bad? `${bad} row${bad>1?"s are":" is"} missing required fields (highlighted): response status, total people, and "Yes" to confirm accuracy.`:"");
  if(saved){ toast(`Submitted ${saved} response row${saved>1?"s":""}`); renderRespList(); }
}

async function exportXlsx(filename,sheetName,aoa,about){

  ws["!cols"]=aoa[0].map((h,i)=>({wch:Math.min(45,Math.max(10,String(h).length+2,...aoa.slice(1,200).map(r=>String(r[i]??"").length+1)))}));
  ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:aoa[0].length-1}})};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,sheetName);
  const ab=XLSX.utils.aoa_to_sheet(about); ab["!cols"]=[{wch:14},{wch:60}]; XLSX.utils.book_append_sheet(wb,ab,"About");
  let dl=null; try{ dl=window.claude?.use? await window.claude.use("downloads") : null; }catch(e){ dl=null; }
  if(dl){
    try{ const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"}); await dl.save({filename,data:new Blob([buf])}); toast("Exported "+filename); }
    catch(e){ if(e?.code!=="declined") toast("Couldn't export: "+(e?.message||e?.code||e)); }
    return;
  }
  try{ XLSX.writeFile(wb,filename); toast("Exported "+filename); }catch(e){ toast("Couldn't export: "+(e?.message||e)); }
}

    body.innerHTML=`<div class="view-title">Partner Mapping</div><div class="meta">Organisations reporting people reached, by service and village${nGap?` · ${nGap} village${nGap>1?"s":""} with no response reported yet`:""}</div>
    <div class="tbl-wrap"><table><thead><tr><th class="stick">District</th><th>Village settlement</th>${RESP_IND.map(i=>`<th title="${esc(i[2])}">${esc(i[1])}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="stick">${esc(dName(r.district))}</td><td>${esc(r.loc)}${gap(r)}</td>${RESP_IND.map(([k])=>`<td class="orgs">${r.o[k]?esc([...r.o[k]].sort().join(", ")):""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return;
  }
  const tot={}; RESP_IND.forEach(([k])=>tot[k]=rows.reduce((s,r)=>s+r.v[k],0));
  body.innerHTML=`<div class="view-title">Village Settlement Summary</div><div class="meta">${rows.length} village${rows.length>1?"s":""} from impact and response reports · ${recs.length} response entr${recs.length===1?"y":"ies"}${nGap?` · ${nGap} with no response reported yet`:""}</div>
  <div class="tbl-wrap"><table>${head(`<th class="stick">District</th><th>Village settlement</th>`)}
  <tbody>${rows.map(r=>`<tr><td class="stick">${esc(dName(r.district))}</td><td>${esc(r.loc)}${gap(r)}</td>${RESP_IND.map(([k])=>`<td class="num">${fmt(r.v[k])}</td>`).join("")}</tr>`).join("")}</tbody>
  <tfoot><tr><td class="stick">Total</td><td></td>${RESP_IND.map(([k])=>`<td class="num">${fmt(tot[k])}</td>`).join("")}</tr></tfoot></table></div>`;
}

/* ---------- start ---------- */
render();
</script>

</body>
</html>
